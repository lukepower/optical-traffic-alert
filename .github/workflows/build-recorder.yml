name: Build OTA Recorder (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "tests/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-recorder.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyserial boto3 pyinstaller pytest "moto[server]"

      - name: Unit tests (feeds, geometry, upload, ingest, review)
        run: pytest -q tests/test_traffic_feeds.py tests/test_geometry.py tests/test_upload.py tests/test_ingest.py

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name OTA-Recorder
          --icon packaging/ota-recorder.ico --collect-submodules ota
          --hidden-import serial.tools.list_ports --collect-data botocore packaging/recorder_main.py

      - name: Self-test the exe
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\selftest.txt"
          Start-Process -FilePath dist\OTA-Recorder\OTA-Recorder.exe -ArgumentList "--self-test", $out -Wait
          if (-not (Test-Path $out)) { throw "self-test produced no output" }
          Get-Content $out

      - name: Package
        shell: pwsh
        run: |
          Copy-Item docs\recorder.md dist\OTA-Recorder\README-recorder.md
          Compress-Archive -Path dist\OTA-Recorder -DestinationPath OTA-Recorder-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OTA-Recorder-windows
          path: OTA-Recorder-windows.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OTA-Recorder-windows.zip
          body: |
            OTA Recorder for Windows: download `OTA-Recorder-windows.zip`, unzip, start `OTA-Recorder.exe`.
            Guide: https://github.com/lukepower/optical-traffic-alert/blob/main/docs/recorder.md
